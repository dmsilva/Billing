<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4a0f2d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fatura Chalet" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/admin-apple-180.png" />
    <link rel="manifest" href="/manifest-admin.webmanifest" />
    <script>
      // A receção instala-se como app própria (ícone rosa, abre em /rececao).
      if (location.pathname.indexOf('/rececao') === 0) {
        document.querySelector('link[rel=manifest]').href = '/manifest-rececao.webmanifest'
        document.querySelector('link[rel=apple-touch-icon]').href = '/icons/rececao-apple-180.png'
        document.querySelector('meta[name=apple-mobile-web-app-title]').content = 'FC Receção'
        document.querySelector('meta[name=theme-color]').content = '#d63384'
      }
    </script>
    <title>Fatura Chalet — Gestão Financeira</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
